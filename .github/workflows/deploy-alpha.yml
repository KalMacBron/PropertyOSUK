name: Deploy Alpha

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read

concurrency:
  group: propertyos-alpha
  cancel-in-progress: true

jobs:
  deploy:
    if: github.head_ref == 'agent/auth-property-onboarding'
    runs-on: ubuntu-latest
    environment:
      name: alpha
      url: https://alpha.propertyosuk.com
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Flutter Web
        run: >
          flutter build web --release
          --dart-define=SUPABASE_URL="${{ secrets.SUPABASE_URL }}"
          --dart-define=SUPABASE_PUBLISHABLE_KEY="${{ secrets.SUPABASE_PUBLISHABLE_KEY }}"

      - name: Deploy to Hostinger
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: 147.93.88.23
          username: u714985569.alpha.propertyosuk.com
          password: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          port: 21
          protocol: ftps
          local-dir: build/web/
          server-dir: /
          dangerous-clean-slate: false
