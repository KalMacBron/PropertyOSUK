name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          cache: true
      - run: flutter --version
      - run: flutter pub get
      - name: Check Dart formatting
        run: |
          dart format --output=none --set-exit-if-changed . || {
            dart format .
            git diff --check
            git diff
            exit 1
          }
      - run: flutter analyze
      - run: flutter test

  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: supabase/setup-cli@v2
        with:
          version: 2.111.0
      - run: supabase --version
      - name: Initialise local Supabase
        run: test -f supabase/config.toml || supabase init
      - name: Start database and apply migrations
        run: supabase db start
      - name: Rebuild database from migrations and seed
        run: supabase db reset
      - name: Run database security tests
        run: supabase test db
      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup

  edge-functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.4
      - run: deno --version
      - name: Check Edge Function formatting
        run: |
          deno fmt --check supabase/functions || {
            deno fmt supabase/functions
            git diff --check
            git diff
            exit 1
          }
      - run: deno check supabase/functions/certificate-processing/index.ts
