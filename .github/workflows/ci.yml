name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Check Dart formatting
        run: |
          dart format --output=none --set-exit-if-changed . || {
            dart format .
            git diff --check
            git diff
            exit 1
          }
      - run: flutter analyze
      - run: flutter test

  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v2
        with:
          version: 2.110.0
      - name: Initialise local Supabase
        run: test -f supabase/config.toml || supabase init
      - name: Start database and apply migrations
        run: supabase db start
      - name: Run database security tests
        run: |
          supabase test db supabase/tests/002_compliance_evidence_security.sql
          supabase test db supabase/tests/003_documents_api_privileges.sql
          supabase test db supabase/tests/004_ai_certificate_processing_security.sql
          supabase test db supabase/tests/005_property_expenses_security.sql
      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup

  edge-functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Check Edge Function formatting
        run: |
          deno fmt --check supabase/functions || {
            deno fmt supabase/functions
            git diff --check
            git diff
            exit 1
          }
      - run: deno check supabase/functions/certificate-processing/index.ts
