name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format .
      - uses: actions/upload-artifact@v4
        with:
          name: formatted-source
          path: |
            lib
            test
      - run: flutter analyze
      - run: flutter test
