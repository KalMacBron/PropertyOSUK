name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze
      - run: flutter test

  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v2
        with:
          version: 2.110.0
      - name: Initialise local Supabase
        run: test -f supabase/config.toml || supabase init
      - name: Start database and apply migrations
        run: supabase db start
      - name: Run database security tests
        run: |
          for test_file in supabase/tests/*.sql; do
            supabase test db "$test_file"
          done

  edge-functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno fmt --check supabase/functions
      - run: deno check supabase/functions/certificate-processing/index.ts
      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup
