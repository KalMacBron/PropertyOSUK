name: Format Milestone 4

on:
  push:
    branches:
      - feature/compliance-evidence
    paths:
      - .github/workflows/format-milestone-4.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/compliance-evidence
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format .
      - name: Commit generated lockfile and formatting
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pubspec.lock lib test
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Apply Dart formatting and lock dependencies"
          git push origin HEAD:feature/compliance-evidence
