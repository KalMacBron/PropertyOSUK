name: Format recovery fix

on:
  push:
    branches:
      - agent/auth-property-onboarding

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/auth-property-onboarding
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Format recovery files
        run: >-
          dart format
          lib/app/property_os_app.dart
          lib/features/auth/application/auth_state.dart
          lib/features/auth/data/auth_repository.dart
          lib/features/auth/presentation/password_recovery_screen.dart
          lib/features/auth/presentation/sign_in_screen.dart
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/
          git commit -m "Format password recovery flow"
          git push
