name: Format recovery fix

on:
  push:
    branches:
      - agent/auth-property-onboarding

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/auth-property-onboarding
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Format branch
        run: dart format .
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Format password recovery flow"
          git push
