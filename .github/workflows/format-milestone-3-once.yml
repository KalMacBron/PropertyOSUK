name: Format Milestone 3 Once

on:
  push:
    branches:
      - feature/property-compliance-register

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/property-compliance-register
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: dart format .
      - name: Commit formatter output
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib test
          git commit -m "Apply Dart formatting"
          git push
